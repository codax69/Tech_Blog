<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="Clear, carefully sourced introductions to the technology shaping how we build and live.">
    <meta name="theme-color" content="#f7f5ef">
    <meta property="og:title" content="TechPulse — technology, made legible">
    <meta property="og:description" content="Careful introductions to the systems changing our world.">
    <meta property="og:type" content="website">
    <title>TechPulse — technology, made legible</title>
    <script>
        (() => {
            try {
                const saved = localStorage.getItem('theme');
                const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.dataset.theme = saved && saved !== 'system' ? saved : system;
            } catch { }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="js/data/posts.js" defer></script>
    <script src="js/app.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="masthead">
        <div class="masthead__inner wrap">
            <a class="wordmark" href="index.html" aria-label="TechPulse home"><span class="wordmark__mark"
                    aria-hidden="true">T<span>.</span></span><span>TechPulse</span></a>
            <p class="masthead__note">Technology, made legible.</p>
            <div class="masthead__tools">
                <label class="search-box"><span class="sr-only">Search articles</span><svg aria-hidden="true"
                        viewBox="0 0 24 24">
                        <circle cx="10.8" cy="10.8" r="6.6"></circle>
                        <path d="m16 16 4.4 4.4"></path>
                    </svg><input id="site-search" type="search" placeholder="Search the journal"
                        autocomplete="off"></label>
                <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch color theme"
                    title="Switch color theme"><svg aria-hidden="true" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path
                            d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42">
                        </path>
                    </svg></button>
                <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation"
                    aria-expanded="false" aria-controls="site-nav"><svg aria-hidden="true" viewBox="0 0 24 24">
                        <path d="M4 7h16M4 12h16M4 17h16"></path>
                    </svg></button>
            </div>
        </div>
        <nav class="site-nav" id="site-nav" aria-label="Main navigation">
            <div class="wrap site-nav__inner">
                <a href="index.html" data-nav="home">Home</a>
                <a href="?view=articles" data-nav="articles">Articles</a>
                <a href="?view=about" data-nav="about">About</a>
                <a href="?view=contact" data-nav="contact">Contact</a>
                <span class="site-nav__aside">Notes on what’s next <span aria-hidden="true">↗</span></span>
            </div>
        </nav>
    </header>

    <main id="main" class="wrap page-shell">
        <div id="page-content" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
        <div class="wrap site-footer__inner">
            <a class="wordmark wordmark--footer" href="index.html"><span class="wordmark__mark"
                    aria-hidden="true">T<span>.</span></span><span>TechPulse</span></a>
            <p>Curious about the systems beneath the surface.</p>
            <nav aria-label="Footer navigation"><a href="?view=articles">Articles</a><a href="?view=about">About</a><a
                    href="?view=contact">Contact</a></nav>
            <small>© <span id="year"></span> TechPulse</small>
        </div>
    </footer>
    <button class="back-top icon-button" id="back-top" type="button" aria-label="Back to top" title="Back to top"><svg
            aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6 14 6-6 6 6"></path>
        </svg></button>
</body>

</html>
